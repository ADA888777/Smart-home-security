{"name":"unzip","on":{"workflow_dispatch":{}},"permissions":{"contents":"write"},"jobs":{"unzip":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"extract-and-commit","run":"set -e\nunzip -q -o Smart-Home-Security.zip -d /tmp/x\nrm -rf /tmp/x/__MACOSX\nfind /tmp/x -maxdepth 2\ncd /tmp/x\nif [ $(ls -A | wc -l) = 1 ] && [ -d $(ls -A) ]; then cd $(ls -A); fi\nrm -rf .git\nsrc=$(pwd)\ncd $GITHUB_WORKSPACE\ncp -r $src/. ./\nls -la\ngit config user.name gh-actions\ngit config user.email gh-actions@users.noreply.github.com\ngit add -A\ngit commit -m extract-zip || echo no-changes\ngit push"}]}}}
